name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: true
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev xvfb
      - run: xvfb-run -a go test ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Studio render smoke test
        run: xvfb-run -a go run ./examples/studio -screenshot /tmp/studio.png
